<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiosk</title>
<style>
body{font:16px/1.5 system-ui,sans-serif;max-width:34rem;margin:1.5rem auto;padding:0 1rem}
input{font:inherit;width:100%;box-sizing:border-box;margin:.2rem 0 .8rem}
button{font:inherit;padding:.6rem 1rem}pre{background:#eee;color:#111;padding:.6rem;overflow:auto;max-height:40vh}
</style></head><body>
<h1>Label kiosk</h1>
<label>Kiosk key <input id="key" value="change-me"></label>
<label>BLE service UUID
  <select id="svcSel">
    <option value="0000ff00-0000-1000-8000-00805f9b34fb">FF00</option>
    <option value="e7810a71-73ae-499d-8c15-faa9aefc3f2">E781</option>
    <option value="49535343-fe7d-4ae5-8fa9-9fafd205e455">4953</option>
    <option value="">Auto / Other...</option>
  </select>
  <input id="svc" hidden>
</label>
<label>BLE write characteristic UUID
  <select id="chrSel">
    <option value="0000ff02-0000-1000-8000-00805f9b34fb">FF02</option>
    <option value="">Auto / Other...</option>
  </select>
  <input id="chr" hidden>
</label>
<label>Label width in pixels (203 DPI, 4in ≈ 812 px, 4.1in ≈ 832 px)
  <input id="w" value="832" inputmode="numeric">
</label>
<label>Label height in pixels (4x6in ≈ 1218 px)
  <input id="h" value="1218" inputmode="numeric">
</label>
<label>Protocol
  <select id="variant">
    <option value="M421">M421 / M110-family</option>
    <option value="D">Raster only (troubleshooting)</option>
  </select>
</label>
<button id="pair">1. Pair printer</button>
<button id="test">Test print</button>
<button id="start">2. Start listening</button>
<p id="status">Not connected.</p>
<pre id="log"></pre>
<canvas id="cv" hidden></canvas>
<script>
const $ = id => document.getElementById(id);
const log = s => { $("log").textContent = s + "\n" + $("log").textContent; };
for (const id of ["key","svc","chr","w","h"]) {
  const v = localStorage.getItem("k_" + id); if (v) $(id).value = v;
  $(id).oninput = () => localStorage.setItem("k_" + id, $(id).value);
}
// UUID dropdowns: a preset fills the hidden input; "Other..." reveals it for a custom UUID.
for (const [sel, inp] of [["svcSel", "svc"], ["chrSel", "chr"]]) {
  const s = $(sel), i = $(inp);
  const sync = () => {
    i.hidden = s.value !== "";
    if (s.value) i.value = s.value;
    localStorage.setItem("k_" + inp, i.value);
  };
  const saved = i.value && [...s.options].some(o => o.value === i.value);
  s.value = saved ? i.value : (i.value ? "" : s.options[0].value);
  s.onchange = sync; sync();
}
let chr = null;

const COMMON_SERVICES = [
  "0000ff00-0000-1000-8000-00805f9b34fb",
  "e7810a71-73ae-499d-8c15-faa9aefc3f2",
  "49535343-fe7d-4ae5-8fa9-9fafd205e455"
];
const FF02 = "0000ff02-0000-1000-8000-00805f9b34fb";

async function findM421Service(server) {
  const requested = $("svc").value.trim().toLowerCase();
  const candidates = requested
    ? [requested, ...COMMON_SERVICES.filter(x => x !== requested)]
    : COMMON_SERVICES;

  for (const uuid of candidates) {
    try { return await server.getPrimaryService(uuid); }
    catch (_) {}
  }

  try {
    const services = await server.getPrimaryServices();
    for (const service of services) {
      const chars = await service.getCharacteristics();
      if (chars.some(c => c.uuid === FF02 ||
          c.properties.write || c.properties.writeWithoutResponse)) {
        return service;
      }
    }
  } catch (_) {}

  throw new Error("Could not find an M421 printer service.");
}

async function findWriteCharacteristic(service) {
  const requested = $("chr").value.trim().toLowerCase();
  const chars = await service.getCharacteristics();

  if (requested) {
    const exact = chars.find(c => c.uuid === requested);
    if (exact) return exact;
  }

  const ff02 = chars.find(c => c.uuid === FF02);
  if (ff02) return ff02;

  const writable = chars.find(c =>
    c.properties.writeWithoutResponse || c.properties.write);
  if (writable) return writable;

  throw new Error("No writable BLE characteristic found.");
}

$("pair").onclick = async () => {
  try {
    const requested = $("svc").value.trim().toLowerCase();
    const optionalServices = [...new Set([
      ...(requested ? [requested] : []),
      ...COMMON_SERVICES
    ])];

    const dev = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices
    });

    const server = await dev.gatt.connect();
    dev.addEventListener("gattserverdisconnected", () => {
      chr = null;
      $("status").textContent = "Disconnected. Pair again.";
      log("Printer disconnected");
    });

    const service = await findM421Service(server);
    chr = await findWriteCharacteristic(service);

    log("Using service " + service.uuid);
    log("Using characteristic " + chr.uuid);
    const props = chr.properties;
    log(`Write char props: write=${props.write} writeNoResp=${props.writeWithoutResponse}`);

    for (const c of await service.getCharacteristics()) {
      log("Found characteristic " + c.uuid +
          (c.properties.notify ? " (notify)" : ""));
      if (c.properties.notify) {
        try {
          await c.startNotifications();
          c.addEventListener("characteristicvaluechanged", e =>
            log("Printer replied on " + c.uuid + ": " +
              [...new Uint8Array(e.target.value.buffer)]
                .map(b => b.toString(16).padStart(2, "0")).join(" ")));
        } catch (e) {
          log("Notify failed on " + c.uuid + ": " + e.message);
        }
      }
    }

    $("status").textContent = "Paired with " + (dev.name || "Phomemo M421");
  } catch (e) {
    $("status").textContent = "Pair failed: " + e.message;
    log("Pair failed: " + e.message);
  }
};

// Draw onto a canvas via draw(ctx, W, H), then pack to a 1-bit bitmap.
function render(draw) {
  let W = Math.max(8, Math.floor(+$('w').value));
  W -= W % 8;
  const H = Math.max(8, Math.floor(+$('h').value));
  const cv = $('cv');
  cv.width = W;
  cv.height = H;

  const c = cv.getContext('2d', { alpha: false });
  c.fillStyle = '#fff';
  c.fillRect(0, 0, W, H);
  c.fillStyle = '#000';
  c.strokeStyle = '#000';
  c.textBaseline = 'alphabetic';
  draw(c, W, H);

  const px = c.getImageData(0, 0, W, H).data;
  const rowBytes = W / 8;
  const out = new Uint8Array(rowBytes * H);

  for (let i = 0; i < W * H; i++) {
    if (px[i * 4] < 128) out[i >> 3] |= 0x80 >> (i & 7);
  }

  return { out, rowBytes, H, W };
}

function concatBytes(...parts) {
  const total = parts.reduce((n, p) => n + p.length, 0);
  const out = new Uint8Array(total);
  let offset = 0;
  for (const p of parts) {
    out.set(p, offset);
    offset += p.length;
  }
  return out;
}

function m421Header(mediaType = 0x0a, speed = 5, density = 10) {
  // M421 is in the M110-family:
  // ESC N 0D <speed>, ESC N 04 <density>, 1F 11 <media type>.
  return new Uint8Array([
    0x1b, 0x4e, 0x0d, speed,
    0x1b, 0x4e, 0x04, density,
    0x1f, 0x11, mediaType
  ]);
}

function m421RasterBlocks(out, rowBytes, height) {
  // One GS v 0 block for the whole image. The height field is 16-bit, and this
  // printer family treats each raster block as its own page, so splitting into
  // 255-row chunks made it feed to a new label every ~1.25 inches.
  return concatBytes(
    new Uint8Array([
      0x1d, 0x76, 0x30, 0x00,
      rowBytes & 0xff, (rowBytes >> 8) & 0xff,
      height & 0xff, (height >> 8) & 0xff
    ]),
    out
  );
}

function m421Footer() {
  // M110-family completion/status commands.
  return new Uint8Array([
    0x1f, 0xf0, 0x05, 0x00,
    0x1f, 0xf0, 0x03, 0x00
  ]);
}

async function writePrinter(data) {
  if (!chr) throw new Error('Printer is not connected.');
  const noResp = chr.properties.writeWithoutResponse;
  const chunkSize = 128;
  log(`Sending ${data.length} bytes (${noResp ? 'without response' : 'with response'})`);

  for (let i = 0; i < data.length; i += chunkSize) {
    const chunk = data.slice(i, i + chunkSize);
    if (noResp) await chr.writeValueWithoutResponse(chunk);
    else await chr.writeValueWithResponse(chunk);
    await new Promise(r => setTimeout(r, 12));
  }
}

async function print(draw) {
  const { out, rowBytes, H, W } = render(draw);
  log(`Rendering ${W} x ${H} pixels (${rowBytes} bytes/row)`);
  const raster = m421RasterBlocks(out, rowBytes, H);

  if ($('variant').value === 'D') {
    await writePrinter(raster);
    return;
  }

  await writePrinter(concatBytes(
    m421Header(0x0a, 5, 10),
    raster,
    m421Footer()
  ));
}

// ---- Dossier label ----------------------------------------------------------
const FONT = "Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace";

function parseOS(d) {
  const ua = d.userAgent || "";
  if (/iPhone|iPad|iPod/.test(ua)) return "iOS " + ((ua.match(/OS (\d+[_\d]*)/) || [])[1] || "").replace(/_/g, ".");
  if (/Android/.test(ua)) return "Android " + ((ua.match(/Android ([\d.]+)/) || [])[1] || "");
  if (/Windows/.test(ua)) return d.osVersion && parseInt(d.osVersion) >= 13 ? "Windows 11" : "Windows 10/11";
  if (/Mac OS X/.test(ua)) return "macOS " + ((ua.match(/Mac OS X ([\d_]+)/) || [])[1] || "").replace(/_/g, ".");
  if (/CrOS/.test(ua)) return "ChromeOS";
  if (/Linux/.test(ua)) return "Linux";
  return d.platform || "Unknown OS";
}
function parseBrowser(d) {
  const ua = d.userAgent || "";
  const m = ua.match(/(Edg|OPR|SamsungBrowser|Firefox|FxiOS|CriOS|Chrome|Version)\/([\d.]+)/);
  const name = !m ? "Browser" : { Edg: "Edge", OPR: "Opera", FxiOS: "Firefox", CriOS: "Chrome", Version: "Safari" }[m[1]] || m[1];
  return name + (m ? " " + m[2].split(".")[0] : "");
}
function deviceKind(d) {
  const ua = d.userAgent || "";
  if (d.model) return d.model;
  if (/iPhone/.test(ua)) return "iPhone";
  if (/iPad/.test(ua)) return "iPad";
  if (/Android/.test(ua)) return /Mobile/.test(ua) ? "Android phone" : "Android tablet";
  return d.touch > 0 ? "Touchscreen computer" : "Computer";
}

// Playful, vibes-based "how identifiable are you" number.
function uniqueness(d) {
  let bits = 6; // user agent
  if (d.screen) bits += 3; if (d.dpr) bits += 1.5; if (d.timezone) bits += 3; if (d.languages) bits += 2;
  if (d.gpu) bits += 5; if (d.canvas) bits += 6; if (d.fonts) bits += 3; if (d.cores) bits += 2;
  if (d.mem) bits += 1.5; if (d.model) bits += 4; if (d.battery) bits += 3; if (d.media) bits += 2;
  if (d.quotaGB) bits += 2; if (d.brands) bits += 2;
  return Math.min(bits, 33);
}
function fmtOneIn(bits) {
  const n = Math.pow(2, bits);
  if (n >= 1e9) return (n / 1e9).toFixed(1) + " billion";
  return n >= 1e6 ? (n / 1e6).toFixed(1) + " million" : Math.round(n).toLocaleString();
}
function roast(d) {
  const picks = [];
  if (d.battery && d.battery.level < 20 && !d.battery.charging) picks.push("Battery at " + d.battery.level + "%. Living dangerously.");
  if (d.battery && d.battery.charging) picks.push("Plugged in. Respect.");
  if (d.dark) picks.push("Dark mode on. A true creature of the night.");
  if (d.cores >= 12) picks.push(d.cores + " CPU cores. Overkill for scrolling.");
  if (d.media && d.media.cams > 1) picks.push(d.media.cams + " cameras. Smile!");
  if (d.dnt === "1" || d.gpc) picks.push("Do Not Track? We tracked it anyway.");
  if (d.webdriver) picks.push("Are you a robot? Suspicious.");
  if (d.reducedMotion) picks.push("Reduced motion: no spooky animations for you.");
  if (d.net && d.net.type === "4g") picks.push("Decent signal. Can't hide.");
  picks.push("I know what you scrolled last summer.");
  return picks[Math.floor(Math.random() * Math.min(picks.length, 3))];
}

function fit(c, text, maxW) {
  text = String(text);
  if (c.measureText(text).width <= maxW) return text;
  while (text.length > 1 && c.measureText(text + "…").width > maxW) text = text.slice(0, -1);
  return text + "…";
}
function wrap(c, text, maxW, maxLines) {
  const lines = []; let line = "";
  for (const word of String(text).split(/(?<=[ ,;/:])/)) {
    if (line && c.measureText(line + word).width > maxW) { lines.push(line.trimEnd()); line = ""; }
    line += word;
  }
  lines.push(line.trimEnd());
  if (lines.length > maxLines) { lines.length = maxLines; lines[maxLines - 1] = fit(c, lines[maxLines - 1] + "…", maxW); }
  return lines;
}

function pumpkin(c, cx, cy, r) {
  c.save();
  c.fillStyle = "#000";
  c.beginPath(); c.ellipse(cx, cy, r * 1.15, r, 0, 0, Math.PI * 2); c.fill();
  c.fillRect(cx - r * .1, cy - r * 1.25, r * .2, r * .35); // stem
  c.fillStyle = "#fff";
  const tri = (x, y, s) => { c.beginPath(); c.moveTo(x, y - s); c.lineTo(x - s, y + s); c.lineTo(x + s, y + s); c.closePath(); c.fill(); };
  tri(cx - r * .45, cy - r * .15, r * .22); tri(cx + r * .45, cy - r * .15, r * .22);
  c.beginPath(); c.moveTo(cx - r * .7, cy + r * .3);
  for (let i = 0; i <= 6; i++) c.lineTo(cx - r * .7 + i * r * .2333, cy + r * (i % 2 ? .3 : .65));
  c.lineTo(cx + r * .7, cy + r * .3); c.closePath(); c.fill();
  c.restore();
}

// Load the selfie (if any) so the synchronous draw function can use it.
async function prep(d) {
  if (!d.photo) return d;
  d._img = await new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = d.photo; });
  return d;
}

// Draw the image as a high-contrast Floyd-Steinberg dithered square (thermal printers only do 1-bit).
function ditherPhoto(c, img, x, y, S) {
  const t = document.createElement("canvas"); t.width = t.height = S;
  const tc = t.getContext("2d", { willReadFrequently: true });
  tc.drawImage(img, 0, 0, S, S);
  const im = tc.getImageData(0, 0, S, S), p = im.data, g = new Float32Array(S * S);
  let lo = 255, hi = 0;
  for (let i = 0; i < S * S; i++) { g[i] = .299 * p[i * 4] + .587 * p[i * 4 + 1] + .114 * p[i * 4 + 2]; lo = Math.min(lo, g[i]); hi = Math.max(hi, g[i]); }
  const k = 255 / Math.max(1, hi - lo);
  for (let i = 0; i < S * S; i++) g[i] = (g[i] - lo) * k;
  for (let yy = 0; yy < S; yy++) for (let xx = 0; xx < S; xx++) {
    const i = yy * S + xx, o = g[i], n = o < 128 ? 0 : 255, e = o - n;
    g[i] = n;
    if (xx + 1 < S) g[i + 1] += e * 7 / 16;
    if (yy + 1 < S) { if (xx > 0) g[i + S - 1] += e * 3 / 16; g[i + S] += e * 5 / 16; if (xx + 1 < S) g[i + S + 1] += e / 16; }
  }
  for (let i = 0; i < S * S; i++) { p[i * 4] = p[i * 4 + 1] = p[i * 4 + 2] = g[i]; p[i * 4 + 3] = 255; }
  tc.putImageData(im, 0, 0);
  c.drawImage(t, x, y);
}

function photoBox(c, d, x, y, S) {
  c.lineWidth = 4; c.strokeRect(x, y, S, S);
  if (d._img) { ditherPhoto(c, d._img, x + 4, y + 4, S - 8); return; }
  c.textAlign = "center";
  const cx = x + S / 2;
  c.font = `bold 22px ${FONT}`;
  c.fillText(d.camera === "denied" ? "CAMERA DENIED" : "NO CAMERA", cx, y + 52);
  c.setLineDash([6, 5]); c.lineWidth = 2; c.beginPath(); c.moveTo(x + 14, y + 68); c.lineTo(x + S - 14, y + 68); c.stroke(); c.setLineDash([]);
  c.font = `20px ${FONT}`;
  const msg = d.camera === "denied" ? "Smart move. Nobody gets your face." : "No photo. Your face lives on.";
  let ly = y + 106;
  for (const l of wrap(c, msg, S - 28, 5)) { c.fillText(l, cx, ly); ly += 26; }
  c.textAlign = "left";
}

    const HEADLINES = ["Trick or Tracked!", "Boo! Gotcha!",
  "Trick or treat? TRICK!"];

function dossier(d) {
  return (c, W, H) => {
    // Thermal paper washes out thin strokes: add a thin outline to every piece of text.
    const fill = c.fillText.bind(c);
    c.fillText = (t, x, y) => {
      c.save(); c.strokeStyle = c.fillStyle; c.lineWidth = 1.2; c.lineJoin = "round"; c.setLineDash([]);
      fill(t, x, y); c.strokeText(t, x, y); c.restore();
    };
    const M = 28, IW = W - M * 2;
    let y = 0;

    // Banner
    c.fillRect(0, 0, W, 84);
    c.fillStyle = "#fff"; c.textAlign = "center";
    c.font = `bold 56px ${FONT}`; c.fillText("DEVICE DOSSIER", W / 2, 60);
    c.fillStyle = "#000"; c.textAlign = "left";
    y = 84;

    // Greeting
    const where = [d.city, d.region].filter(Boolean).join(", ") || d.country || "somewhere";
    c.font = `bold 38px ${FONT}`;
    c.fillText(fit(c, HEADLINES[Math.floor(Math.random() * HEADLINES.length)], IW - 130), M, y + 52);
    c.font = `22px ${FONT}`;
    c.fillText(fit(c, `Caught: ${deviceKind(d)} in ${where}`, IW - 130), M, y + 84);
    pumpkin(c, W - M - 62, y + 56, 36);
    y += 100;
    c.setLineDash([10, 8]); c.lineWidth = 3; c.beginPath(); c.moveTo(M, y); c.lineTo(W - M, y); c.stroke(); c.setLineDash([]);
    y += 8;

    const geo = d.lat != null ? `${(+d.lat).toFixed(2)}, ${(+d.lon).toFixed(2)}` : null;
    const b = d.battery ? `${d.battery.level}%${d.battery.charging ? " (charging)" : ""}` : null;
    const net = d.net ? `${d.net.type} ${d.net.down || "?"}Mbps ${d.net.rtt || "?"}ms` : null;
    const hw = [d.media && `${d.media.cams} cam`, d.media && `${d.media.mics} mic`, d.touch ? `${d.touch}-touch` : null].filter(Boolean).join(" ");
    const display = d.hz ? `${d.hz}Hz, ${d.hdr ? "HDR" : d.p3 ? "wide-gamut color" : "standard color"}` : (d.hdr ? "HDR" : d.p3 ? "wide-gamut color" : null);
    const sections = [
      ["WHAT YOU'RE RUNNING", [
        ["OS", parseOS(d) + (d.arch ? ` ${d.arch}${d.bitness || ""}` : "")], ["Browser", parseBrowser(d)],
        ["Language", d.languages || d.language], ["Theme", d.dark ? "dark mode" : "light mode"],
        ["Privacy", `cookies ${d.cookies ? "on" : "off"}, DNT ${d.dnt === "1" || d.gpc ? "on (ignored)" : "off"}`],
      ]],
      ["WHERE YOU ARE", [
        ["IP", d.ip], ["City", [d.city, d.region, d.postal].filter(Boolean).join(" ")],
        ["Country", [d.country, d.continent].filter(Boolean).join(" / ")], ["Lat/Lon", geo],
        ["Timezone", `${d.timezone} (UTC${d.tzOffset >= 0 ? "+" : ""}${d.tzOffset / 60})`],
        ["ISP", d.isp ? `${d.isp}${d.asn ? " AS" + d.asn : ""}` : null], ["Network", net],
      ]],
      ["WHAT YOU'RE CARRYING", [
        ["Device", deviceKind(d)], ["Screen", `${d.screen} @${d.dpr}x, view ${d.viewport}`], ["Display", display],
        ["CPU/RAM", `${d.cores || "?"} cores / ${d.mem ? d.mem + "GB+" : "?"}`],
        ["GPU", d.gpu], ["Battery", b], ["Sensors", hw],
      ]],
    ];

    const LH = 26, KEY_W = 140;
    const PH = 270, photoTop = y + 4, photoBottom = photoTop + PH; // photo box
    for (const [i, [title, rows]] of sections.entries()) {
      if (i === 0) photoBox(c, d, W - M - PH, photoTop, PH);
      const live = rows.filter(r => r[1] != null && r[1] !== "" && r[1] !== "undefined");
      if (!live.length) continue;
      c.font = `bold 24px ${FONT}`; c.fillText("[" + title + "]", M, y + 24); y += 32;
      for (const [k, v] of live) {
        c.font = `bold 22px ${FONT}`; c.fillText(k, M, y + 20);
        c.font = `22px ${FONT}`;
        const ls = wrap(c, v, IW - KEY_W - (y < photoBottom ? PH + 16 : 0), 2);
        for (const l of ls) { c.fillText(l, M + KEY_W, y + 20); y += LH; }
        if (!ls.length) y += LH;
      }
      if (i === 1) y = Math.max(y, photoBottom + 4);
      y += 4;
    }

    // UA line (small)
    c.font = `18px ${FONT}`;
    for (const l of wrap(c, d.userAgent || "", IW, 2)) { c.fillText(l, M, y + 17); y += 22; }
    y += 6;

    // Fingerprint meter
    const bits = uniqueness(d);
    c.setLineDash([10, 8]); c.lineWidth = 3; c.beginPath(); c.moveTo(M, y); c.lineTo(W - M, y); c.stroke(); c.setLineDash([]);
    y += 30;
    c.font = `bold 26px ${FONT}`; c.fillText("UNIQUENESS: 1 in " + fmtOneIn(bits), M, y);
    y += 10;
    c.lineWidth = 4; c.strokeRect(M, y, IW, 26);
    c.fillRect(M + 4, y + 4, (IW - 8) * Math.min(1, bits / 38), 18);
    y += 50;
    c.font = `italic 22px ${FONT}`;
    for (const l of wrap(c, roast(d), IW, 2)) { c.fillText(l, M, y); y += 26; }

    // Footer: why a unique device matters
    const msg = "Your device's unique mix of hardware, software and settings is a fingerprint. " +
      "Trackers use it to recognize you across different websites and networks, even in private mode, with cookies off, or on new Wi-Fi.";
    c.font = `20px ${FONT}`;
    const ml = wrap(c, msg, IW - 36, 6), bh = 48 + ml.length * 24;
    const by = Math.max(y + 4, H - bh - 50);
    c.lineWidth = 4; c.strokeRect(M, by, IW, bh);
    c.font = `bold 24px ${FONT}`; c.fillText("YOU CAN BE FOLLOWED", M + 18, by + 34);
    c.font = `20px ${FONT}`;
    ml.forEach((l, k) => c.fillText(l, M + 18, by + 62 + k * 24));
    c.textAlign = "center";
    c.font = `bold 21px ${FONT}`;
    c.fillText("Happy Halloween! DATA PRIVACY IS SCARY.", W / 2, by + bh + 30);
    c.textAlign = "left";
  };
}

const testLabel = (c, W, H) => {
  c.font = "bold 52px sans-serif"; c.fillText("Test print", 30, 60);
  c.font = "34px sans-serif"; c.fillText("Hello from the kiosk", 30, 108);
};

$("test").onclick = () => chr ? print(testLabel).catch(e => log(e.message)) : log("Pair first.");

$("start").onclick = () => {
  if (!chr) return log("Pair first.");
  $("status").textContent = "Listening...";
  let busy = false;
  setInterval(async () => {
    if (busy) return; busy = true;
    try {
      const k = encodeURIComponent($("key").value);
      const job = await (await fetch("/api/next?key=" + k)).json();
      if (job) { log(`Job ${job.id.slice(0, 8)}: camera=${job.data.camera || "n/a"}, photo=${job.data.photo ? job.data.photo.length + " chars" : "none"}${job.data.camErr ? ", err=" + job.data.camErr : ""}`); await print(dossier(await prep(job.data))); await fetch(`/api/ack?key=${k}&id=${job.id}`, { method: "POST" }); log("Printed " + job.id.slice(0, 8)); }
    } catch (e) { log("Error: " + e.message); }
    busy = false;
  }, 3000);
};
